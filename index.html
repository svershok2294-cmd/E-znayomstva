<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Е-Знайомства</title>
    <!-- Підключення Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-black: #0a0a0a;
            --bg-white: #ffffff;
            --border-width: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none; /* Safari/Chrome */
        }

        body {
            background-color: var(--bg-black);
            color: var(--bg-white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Шаховий патерн у шапці */
        .chess-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: var(--border-width) solid var(--bg-white);
            /* Генерація шахового патерну через CSS */
            background-image: 
                linear-gradient(45deg, #181818 25%, transparent 25%), 
                linear-gradient(-45deg, #181818 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #181818 75%), 
                linear-gradient(-45deg, transparent 75%, #181818 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        .logo {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--bg-black);
            padding: 4px 8px;
            border: 1px solid var(--bg-white);
        }

        /* Контейнер анкети */
        .profile-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden; /* Щоб картки не вилазили */
        }

        .profile-card {
            border: var(--border-width) solid var(--bg-white);
            background: var(--bg-black);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
        }

        .profile-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Чорно-білий фільтр для естетики */
            filter: grayscale(100%) contrast(115%);
            z-index: 1;
        }

        .profile-info {
            position: relative;
            z-index: 2;
            background: rgba(10, 10, 10, 0.9);
            border-top: var(--border-width) solid var(--bg-white);
            padding: 14px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .profile-bio {
            font-size: 13px;
            color: #d0d0d0;
            margin-bottom: 10px;
        }

        /* Кнопки дій у шаховому стилі */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 14px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border: var(--border-width) solid var(--bg-white);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-black {
            background: var(--bg-black);
            color: var(--bg-white);
        }

        .btn-white {
            background: var(--bg-white);
            color: var(--bg-black);
        }
    </style>
</head>
<body>

    <div class="chess-header">
        <div class="logo">♟ Е-ЗНАЙОМСТВА</div>
    </div>

    <!-- Екран 1: Свайпи -->
    <div class="profile-container">
        <div class="profile-card" id="card">
            <img id="p-img" class="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Profile">
            <div class="profile-info">
                <div class="profile-name" id="p-name">Анна, 25 • Київ</div>
                <div class="profile-bio" id="p-bio">Архітекторка. Ціную інтелектуальний гумор та хорошу каву. Люблю партію в шахи на вихідних.</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-black" onclick="nextProfile()">✕ Пас</button>
            <button class="btn btn-black" onclick="superLike()">♛ Суперхід</button>
            <button class="btn btn-white" onclick="nextProfile()">♥ Хід</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        // Розгортаємо апку на весь екран
        tg.expand();
        // Включаємо вібровіддачу при кліку
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        const profiles = [
            {
                name: "Марія, 23 • Львів",
                bio: "Архітекторка. Ціную чорно-білу естетику.",
                img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "Олена, 27 • Одеса",
                bio: "Обожнюю море, подорожі та спонтанні рішення.",
                img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"
            }
        ];
        let currentIdx = 0;

        function nextProfile() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            currentIdx = (currentIdx + 1) % profiles.length;
            const p = profiles[currentIdx];
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-bio').innerText = p.bio;
            document.getElementById('p-img').src = p.img;
        }

        function superLike() {
            alert("♛ Це Суперхід! Функція підключення Telegram Stars буде активована, як тільки бот запрацює.");
        }
    </script>
</body>
</html>
